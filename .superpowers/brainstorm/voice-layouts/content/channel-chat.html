<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>频道聊天 · 开黑大厅草图</title>
<style>
:root{color-scheme:light;--ink:#17263d;--muted:#5d6c81;--line:#e1e6ee;--blue:#445dd4;--pale:#e8edff;font:15px/1.5 "Inter","Segoe UI","Microsoft YaHei UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#edf0f5;color:var(--ink)}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #708cf0;outline-offset:2px}button{border:none}button:disabled{cursor:default}button:hover:not(:disabled){filter:brightness(.96)}h1,h2,h3,p{margin:0}h1{font-size:21px;letter-spacing:-.04em}h2{font-size:18px}h3{font-size:12px;color:var(--muted);font-weight:650}main{width:min(1236px,96%);margin:auto;padding:25px 0}.preview{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);margin-bottom:14px;font-size:13px}.preview strong{color:var(--ink);font-size:15px}.app{display:grid;grid-template-columns:225px minmax(0,1fr) 190px;grid-template-rows:auto minmax(0,1fr);height:clamp(480px,82dvh,810px);border:1px solid #d2dbe7;border-radius:17px;box-shadow:0 14px 44px #26394c12;background:white;overflow:hidden}.rail{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;min-height:0;background:#f2f5fa;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:23px 16px;font-weight:700;font-size:16px}.logo{display:flex;align-items:center;justify-content:center;gap:2px;width:32px;height:32px;border-radius:9px;background:var(--blue)}.logo i,.wave i{width:2px;border-radius:3px;background:currentColor;color:white}.logo i:nth-child(1){height:8px}.logo i:nth-child(2){height:16px}.logo i:nth-child(3){height:11px}.logo i:nth-child(4){height:20px}.rail h3{margin:10px 18px}.channels{display:flex;flex-direction:column;gap:4px;padding:0 10px}.channel{display:flex;gap:9px;align-items:center;text-align:left;padding:10px;border-radius:9px;color:#4d5e74;background:transparent;font-weight:560;font-size:14px;white-space:nowrap}.channel[aria-current=true]{background:#e0e8fd;color:#294c9a}.count{margin-left:auto;font:500 12px "Segoe UI",sans-serif;color:var(--muted)}.profile{margin-top:auto;border-top:1px solid var(--line);padding:16px;display:flex;align-items:center;gap:9px}.profile small,.main-head small{color:var(--muted);font-size:12px}.profile b{display:block;font-size:14px}.avatar{width:33px;height:33px;display:inline-grid;place-items:center;border-radius:10px;font-weight:650;font-size:14px;color:var(--fg);background:var(--bg);flex-shrink:0}.main-head{grid-column:2/4;grid-row:1;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px;padding:15px 22px;min-width:0}.main-head h1{display:inline-block}.good{width:7px;height:7px;border-radius:50%;display:inline-block;background:#39936c;margin-right:5px}.primary{color:#fff;background:var(--blue);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600}.invite{margin-left:auto}.chat{display:flex;flex-direction:column;min-height:0;grid-column:2;grid-row:2}.chat-title{display:flex;align-items:center;gap:7px;padding:17px 22px 10px;color:#495974;font-size:13px;font-weight:600}.messages{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:5px 22px 18px}.msg{display:flex;align-items:flex-start;gap:11px;margin:14px 0}.msg-content{min-width:0}.by{display:flex;align-items:baseline;gap:8px;font-size:13px}.by strong{font-weight:650}.by time{font:12px "Segoe UI",sans-serif;color:#69768b}.msg p{color:#293b52;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:15px}.msg.mine .by strong{color:var(--blue)}.composer{padding:10px 16px 11px;border-top:1px solid var(--line)}.write{display:flex;gap:8px;align-items:flex-end;border:1px solid #cdd7e6;background:#f9fafc;border-radius:10px;padding:8px}.write:focus-within{border-color:#778ce4}.write textarea{flex:1;min-width:0;max-height:100px;resize:vertical;border:0;background:transparent;color:var(--ink);padding:4px 5px;line-height:1.5}.write textarea:focus{outline:none}.write button:disabled{background:#e2e6ef;color:#768198}.composer small{display:block;color:var(--muted);font-size:11px;margin:4px 2px 0}.audio{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:#fbfcfd}.audio button,.secondary{background:#edf0f7;color:#34465f;border-radius:8px;padding:6px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}.audio .mic-on{background:#e0f2e9;color:#216446}.audio .mic-off{background:#f6e4e4;color:#873f45}.audio-status{margin-left:auto;font-size:11px;color:var(--muted)}.members{grid-row:2;grid-column:3;padding:20px 12px;border-left:1px solid var(--line)}.people{list-style:none;padding:0;margin:12px 0}.people li{display:flex;align-items:center;gap:7px;font-size:13px;padding:7px 3px}.people .avatar{width:26px;height:26px;font-size:12px}.wave{display:inline-flex;align-items:center;gap:2px;margin-left:auto}.wave i{color:#439270}.wave i:nth-child(odd){height:7px}.wave i:nth-child(2){height:14px}.wave i:nth-child(4){height:10px}.empty{color:var(--muted);padding:16px 0;font-size:13px}.glyph{width:16px;height:16px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);border-radius:10px;background:#223046;color:white;padding:8px 15px;box-shadow:0 4px 20px #17243725;font-size:13px;text-align:center}.toast:empty{display:none}
@media(max-width:960px){.app{grid-template-columns:186px minmax(0,1fr) 145px}.main-head,.chat-title,.messages{padding-left:15px;padding-right:15px}.brand{padding:18px 12px}.members{padding:18px 9px}}
@media(max-width:760px){.app{grid-template-columns:154px minmax(0,1fr)}.members{display:none}.main-head{grid-column:2}.audio-status{display:none}.profile{padding:10px}.brand{gap:6px;font-size:14px}}
@media(max-width:560px){main{padding:10px 0;width:97%}.preview{margin:0 5px 8px;font-size:11px}.preview strong{font-size:13px}.app{display:flex;flex-direction:column;height:calc(100dvh - 61px);min-height:390px}.rail{border:0;border-bottom:1px solid var(--line);padding:7px}.rail .brand,.rail h3,.profile{display:none}.channels{flex-direction:row;padding:0;gap:4px}.channel{padding:7px;gap:4px;font-size:12px}.channel .count{margin-left:3px}.main-head{padding:10px 13px}.chat{flex:1}.chat-title{padding-top:9px}.messages{padding-top:0}.composer,.audio{padding-left:9px;padding-right:9px}.msg{margin:10px 0}h1{font-size:18px}}
</style>
</head><body>
<main>
<div class="preview"><strong>频道侧栏 · 聊天草图</strong><span>本地演示，刷新清空</span></div>
<div class="app">
 <aside class="rail"><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>周末开黑局</div><h3>语音频道</h3><nav class="channels" aria-label="频道列表"></nav><div class="profile"><span class="avatar" style="--bg:#fae7ba;--fg:#6b5022">舟</span><div><b>林舟</b><small>我的身份</small></div></div></aside>
 <div class="main-head"><div><h1 id="roomName"></h1><br><small><span class="good"></span>已加入语音</small></div><button type="button" class="primary invite">邀请好友</button></div>
 <section class="chat" aria-label="频道聊天"><div class="chat-title">频道聊天</div><div class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
 <form class="composer"><div class="write"><textarea rows="1" aria-label="频道消息"></textarea><button class="primary" type="submit" disabled>发送</button></div><small>Enter 发送 · Shift + Enter 换行</small></form>
 <div class="audio"><button type="button" id="mute" class="mic-on" aria-pressed="false">麦克风已开启</button><button type="button" id="mode">持续开麦</button><span class="audio-status">语音控制预览</span></div></section>
 <aside class="members"><h3 id="membersTitle">频道成员</h3><ul class="people"></ul></aside>
</div></main><div class="toast" role="status"></div>
<script>
const players=[
 {name:'阿岚',tag:'岚',bg:'#dceecb',fg:'#385732'},
 {name:'小满',tag:'满',bg:'#f3dbd2',fg:'#784c42'},
 {name:'北辰',tag:'辰',bg:'#d4e8f6',fg:'#315875'},
 {name:'松子',tag:'松',bg:'#e8dcf4',fg:'#665276'},
 {name:'林舟',tag:'舟',bg:'#fae7ba',fg:'#6b5022'}];
const me=4;
const rooms=[
 {name:'排位一队',others:[0,1,2,3],messages:[[0,'20:41','我先进训练场调一下麦，大家听得清吗？'],[1,'20:41','听得清。房间号发在这儿吧。'],[0,'20:42','房间号 8621，我在蓝队。'],[2,'20:42','进来了，等松子就开。']]},
 {name:'二队',others:[],messages:[]},{name:'休息区',others:[],messages:[]}];
const drafts=rooms.map(()=>''),chat=document.querySelector('.messages'),box=document.querySelector('textarea'),send=document.querySelector('.write button');
let active=0,composing=false,muted=false,ptt=false,noticeTimer;
const make=(tag,cls,text)=>{const item=document.createElement(tag);if(cls)item.className=cls;if(text!==undefined)item.textContent=text;return item};
function avatar(id){const p=players[id],badge=make('span','avatar',p.tag);badge.style.setProperty('--bg',p.bg);badge.style.setProperty('--fg',p.fg);badge.setAttribute('aria-hidden','true');return badge}
function drawMessage([id,time,text]){
 const row=make('article','msg'+(id===me?' mine':'')),content=make('div','msg-content'),by=make('div','by');by.append(make('strong','',players[id].name+(id===me?' · 我':'')),make('time','',time));content.append(by,make('p','',text));row.append(avatar(id),content);chat.append(row);
}
function showChannel(){
 const r=rooms[active];document.querySelector('#roomName').textContent=r.name;
 const nav=document.querySelector('.channels');nav.replaceChildren();
 rooms.forEach((room,index)=>{const button=make('button','channel');button.type='button';button.setAttribute('aria-current',String(index===active));button.append(make('span','','⌁'),make('span','',room.name),make('span','count',String(room.others.length+(index===active?1:0))));button.onclick=()=>{if(active===index)return;drafts[active]=box.value;active=index;composing=false;showChannel()};nav.append(button)});
 const list=document.querySelector('.people');list.replaceChildren();const memberIds=[...r.others,me];document.querySelector('#membersTitle').textContent='频道成员 · '+memberIds.length;
 memberIds.forEach(id=>{const item=make('li');item.append(avatar(id),make('span','',players[id].name+(id===me?' · 我':'')));if(id===0){const wave=make('span','wave');wave.setAttribute('aria-label','正在说话');for(let i=0;i<4;i++)wave.append(make('i'));item.append(wave)}list.append(item)});
 chat.replaceChildren();if(!r.messages.length)chat.append(make('p','empty','频道里还没有文字消息。'));r.messages.forEach(drawMessage);chat.scrollTop=chat.scrollHeight;
 box.value=drafts[active];box.placeholder='发消息到「'+r.name+'」';send.disabled=!box.value.trim();
}
function sendMessage(){
 const text=box.value.trim();if(!text||composing)return;const now=new Date(),time=[now.getHours(),now.getMinutes()].map(v=>String(v).padStart(2,'0')).join(':');
 const msg=[me,time,text];rooms[active].messages.push(msg);chat.querySelector('.empty')?.remove();drawMessage(msg);box.value='';drafts[active]='';send.disabled=true;chat.scrollTop=chat.scrollHeight;box.focus();
}
document.querySelector('.composer').addEventListener('submit',e=>{e.preventDefault();sendMessage()});
box.addEventListener('input',()=>{send.disabled=!box.value.trim()});box.addEventListener('compositionstart',()=>composing=true);box.addEventListener('compositionend',()=>composing=false);
box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();sendMessage()}});
document.querySelector('#mute').onclick=e=>{muted=!muted;e.currentTarget.className=muted?'mic-off':'mic-on';e.currentTarget.textContent=muted?'麦克风已关闭':'麦克风已开启';e.currentTarget.setAttribute('aria-pressed',String(muted))};
document.querySelector('#mode').onclick=e=>{ptt=!ptt;e.currentTarget.textContent=ptt?'按键说话 · V':'持续开麦'};
document.querySelector('.invite').onclick=()=>{clearTimeout(noticeTimer);document.querySelector('.toast').textContent='草图预览 · 正式版会生成大厅邀请链接';noticeTimer=setTimeout(()=>document.querySelector('.toast').textContent='',2500)};
showChannel();
</script></body></html>
