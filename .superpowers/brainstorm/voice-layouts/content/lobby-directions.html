<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>组队语音 · 大厅界面草图</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f3ef;color:#211f22;font:15px/1.5 "Inter","Segoe UI","Microsoft YaHei UI",sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #478ed0;outline-offset:3px}main{max-width:1700px;margin:auto;padding:38px clamp(16px,3.5vw,60px) 40px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;border-bottom:1px solid #d7d4cd;padding-bottom:21px;margin-bottom:26px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,3vw,40px);font-weight:720;letter-spacing:-.045em}header p{color:#645e63;margin-top:6px}header nav{display:flex;gap:6px}nav a{color:#504c50;border:1px solid #cecbc5;text-decoration:none;border-radius:30px;padding:5px 12px;white-space:nowrap;font-size:13px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,32px)}.idea{min-width:0;scroll-margin:15px}.caption{display:flex;align-items:center;gap:10px;margin-bottom:12px}.caption span{font:650 14px/28px "Segoe UI",sans-serif;width:28px;text-align:center;border:1px solid #c9c4be;border-radius:50%}.caption h2{font-size:19px;letter-spacing:-.025em}.window{border-radius:18px;overflow:hidden;border:1px solid var(--edge);color:var(--ink);height:438px;display:flex;flex-direction:column;background:var(--base);position:relative;box-shadow:0 10px 25px #26202d0c}.light{--edge:#d7deea;--ink:#172944;--faint:#576980;--base:#fff;--button:#edf1f8;--accent:#415eda}.dark{--edge:#333c38;--ink:#e8efe9;--faint:#a3b0a6;--base:#161d1a;--button:#2c3831;--accent:#b6ed93}.bar,.foot{padding:0 clamp(10px,1.3vw,20px);display:flex;align-items:center;gap:8px;flex-shrink:0}.bar{height:48px;border-bottom:1px solid var(--edge);font-size:13px;font-weight:650}.window .bar .equalizer{background:var(--accent);width:25px;height:25px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:2px}.equalizer b,.wave b{display:inline-block;width:2px;border-radius:2px}.equalizer b{background:var(--base)}.bar .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}.statusdot{width:7px;height:7px;border-radius:100%;background:#64ae82}.body{flex:1;min-height:0;display:flex}.rail{width:30%;max-width:180px;background:#f2f5fa;border-right:1px solid var(--edge);padding:19px 8px}.rail label{font:600 11px/1.5 inherit;color:var(--faint);padding-left:8px}.room{border:0;color:var(--faint);background:transparent;display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;min-height:35px;border-radius:7px;padding:4px 7px}.rail .room{width:100%;margin-top:4px}.room em{font:500 11px "Segoe UI",sans-serif;margin-left:auto;opacity:.75}.light .room.on{background:#dfe8fc;color:#2a4e99;font-weight:650}.roomicon{font-size:14px;opacity:.8}.lightcontent{flex:1;min-width:0;padding:17px clamp(10px,1.3vw,22px)}.roomhead{display:flex;align-items:center;justify-content:space-between;gap:5px}h3{font-size:20px;letter-spacing:-.04em}.sub{font-size:11px;color:var(--faint);margin:1px 0 10px}.invite{border:1px solid var(--edge);background:transparent;color:var(--ink);font-size:12px;padding:4px 8px;border-radius:6px}.member{display:flex;align-items:center;gap:9px;padding:5px 7px;min-height:38px;border-radius:9px}.member.first{background:#f0f4ff}.avatar{width:28px;height:28px;border-radius:10px;display:inline-grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:700;background:var(--badge);color:var(--letter)}.who{font-size:13px;font-weight:600}.you{font-size:10px;font-weight:400;color:var(--faint);margin-left:6px}.wave{display:inline-flex;align-items:center;gap:2px;height:21px;color:var(--accent)}.wave b{background:currentColor}.member .wave,.member .mic{margin-left:auto}.mic{display:inline-flex;color:var(--faint)}.icon{width:15px;height:15px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.foot{min-height:58px;border-top:1px solid var(--edge);justify-content:space-between;gap:5px}.control{border:1px solid transparent;background:var(--button);color:var(--ink);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;font-size:12px;white-space:nowrap}.light .mute{background:#e4f4ec;color:#216845}.dark .mute{background:#c4f1a8;color:#1c3624}.mute.off{background:#efe0df;color:#7f3434}.dark .mute.off{background:#492c30;color:#ffc2c2}.dark .mainstage{width:100%;padding:13px clamp(10px,1.3vw,20px);display:flex;flex-direction:column}.tabs{display:flex;gap:5px;margin-bottom:10px}.tabs .room{background:#26302b;padding:1px 9px;min-height:27px}.tabs .room.on{color:var(--accent);background:#354839}.stage-room{font-size:18px}.speaker{flex:1;min-height:68px;border-radius:11px;display:flex;align-items:center;padding:12px 16px;gap:15px;background:radial-gradient(ellipse at 90% 110%,#3d5540 0,transparent 62%),#273b30;border:1px solid #425c48;margin-top:9px}.speaker .avatar{border-radius:50%;height:46px;width:46px;font-size:23px;box-shadow:0 0 0 4px #9fcc931c}.speaker small{font-size:11px;color:#b4d6bc}.speaker strong{display:block;font-size:20px}.speaker .wave{margin-left:auto;gap:3px}.speaker .wave b{width:3px}.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.tile{display:grid;place-items:center;gap:3px;background:#222c26;padding:7px 1px;border-radius:8px;font-size:11px}.tile .avatar{height:23px;width:23px;font-size:11px;border-radius:50%}.empty{font-size:13px;color:var(--faint);padding:15px 0}.summary{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 1px}.summary p{color:#625d61;font-size:13px;line-height:1.65}.pick{white-space:nowrap;font-weight:650;border:1px solid #aaa4a0;background:#faf9f6;border-radius:30px;padding:5px 13px;font-size:13px;color:#383338}.pick.selected{background:#292529;color:white;border-color:#292529}.tip{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);border:1px solid var(--edge);background:var(--base);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:12px;white-space:nowrap;box-shadow:0 5px 14px #0002}.notice{min-height:22px;color:#555055;font-size:13px}.sidebar-note{font-size:11px;color:var(--faint)}.endhint{font-size:11px;color:var(--faint);white-space:nowrap}.foot .mode{margin-left:auto} @media(min-width:1450px){.window{height:474px}.member{min-height:44px}.speaker{min-height:90px}}@media(max-width:940px){.gallery{grid-template-columns:1fr;max-width:690px;margin:auto}main{max-width:780px}.window{height:402px}.bar,.foot{padding:0 16px}.lightcontent,.mainstage{padding:15px}.member{min-height:36px}.speaker{min-height:60px}}@media(max-width:520px){main{padding:20px 12px}header{display:block}header nav{margin-top:12px}.rail{width:28%;padding:14px 3px}.rail .room{font-size:11px}.lightcontent{padding:14px 8px}.foot{padding:0 7px}.endhint{display:none}.summary p{font-size:12px}.speaker{padding:10px}.caption{margin-bottom:8px}}
</style>
</head><body><main>
<header><div><h1>开黑大厅，哪种更顺手？</h1><p>两版展示同一支五人小队。可以试切频道、切换开麦方式，再选你喜欢的一版。</p></div><nav aria-label="跳转到草图"><a href="#a">看 A</a><a href="#b">看 B</a></nav></header>
<div class="gallery">
<section class="idea" id="a"><div class="caption"><span>A</span><h2>频道侧栏</h2></div><div class="light window" id="app-a"></div><div class="summary"><p>频道始终在左侧，适合一群朋友分成几队、经常换房。</p><button class="pick" data-choice="a" aria-pressed="false">选 A</button></div></section>
<section class="idea" id="b"><div class="caption"><span>B</span><h2>小队舞台</h2></div><div class="dark window" id="app-b"></div><div class="summary"><p>正在讲话的人放在中央，队友和麦克风状态一眼可见。</p><button class="pick" data-choice="b" aria-pressed="false">选 B</button></div></section>
</div><p class="notice" aria-live="polite"></p></main>
<script>
const names=['阿岚','小满','北辰','松子','林舟'];
const shades=[['#d0e7bf','#354f29'],['#ead9cd','#664c3c'],['#cce0ec','#30556b'],['#e4d6ed','#664974'],['#f0e5b9','#685829']];
const rooms=['排位一队','二队','休息区'];
const paths={mic:'<rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-3 0h6"/>',off:'<path d="m3 3 18 18M5 11a7 7 0 0 0 12 5m2-5a7 7 0 0 1-.6 3M8 8v3a4 4 0 0 0 6.7 3M9 4a4 4 0 0 1 7 3v4M12 18v3m-3 0h6"/>',key:'<rect x="2" y="6" width="20" height="13" rx="3"/><path d="M6 10h1m3 0h1m3 0h1m3 0h.1M7 15h10"/>',person:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 10-4m5-4v8m-4-4h8"/>'};
const icon=key=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+paths[key]+'</svg>';
function bars(values){return values.map(h=>'<b style="height:'+h+'px"></b>').join('')}
function avatar(i){return '<span class="avatar" style="--badge:'+shades[i][0]+';--letter:'+shades[i][1]+'">'+names[i].slice(-1)+'</span>'}
function label(i){return names[i]+(i===4?'<span class="you">我</span>':'')}
function mount(id,scene){
 const root=document.getElementById(id);let room=0,muted=false,ptt=false,tipTimer;
 function draw(){
  const people=room===0?[0,1,2,3,4]:[4];
  const channelLinks=rooms.map((name,i)=>'<button class="room '+(room===i?'on':'')+'" data-room="'+i+'" aria-pressed="'+(room===i)+'"><span class="roomicon">⌁</span>'+name+' <em>'+(i===0?(room===0?5:4):(room===i?1:0))+'</em></button>').join('');
  const invite='<button class="invite" data-act="invite">'+icon('person')+' 邀请</button>';
  const roomTitle='<div class="roomhead"><h3>'+rooms[room]+'</h3>'+invite+'</div>';
  const wave='<span class="wave" aria-label="正在说话">'+bars([4,10,17,8,20,12,6])+'</span>';
  const memberRows=people.map(i=>'<div class="member '+(i===0?'first':'')+'">'+avatar(i)+'<span class="who">'+label(i)+'</span>'+(i===0?wave:'<span class="mic">'+icon(i===4&&muted?'off':'mic')+'</span>')+'</div>').join('');
  const body=scene==='light'?'<div class="body"><aside class="rail"><label>语音频道</label>'+channelLinks+'</aside><div class="lightcontent">'+roomTitle+'<p class="sub">'+people.length+' 人在频道</p>'+memberRows+'</div></div>':
  '<div class="body"><div class="mainstage"><div class="tabs">'+channelLinks+'</div>'+roomTitle+(room===0?'<div class="speaker">'+avatar(0)+'<div><small>正在说话</small><strong>'+names[0]+'</strong></div>'+wave+'</div><div class="team">'+people.slice(1).map(i=>'<div class="tile">'+avatar(i)+'<span>'+label(i)+'</span></div>').join('')+'</div>':'<div class="speaker">'+avatar(4)+'<div><small>'+ (muted?'麦克风已关闭':'已加入频道')+'</small><strong>'+names[4]+'</strong></div></div>')+'</div></div>';
  root.innerHTML='<div class="bar"><span class="equalizer">'+bars([6,13,9,17,7])+'</span>周末开黑局<span class="count">5 人在线</span><i class="statusdot"></i></div>'+body+'<div class="foot"><button class="control mute '+(muted?'off':'')+'" data-act="mute" aria-pressed="'+muted+'">'+icon(muted?'off':'mic')+(muted?'麦克风已关闭':'麦克风已开启')+'</button><button class="control mode" data-act="mode" title="切换开麦方式">'+icon('key')+(ptt?'按键说话':'持续开麦')+' ▾</button>'+(ptt?'<span class="endhint">按住 V</span>':'')+'</div>';
 }
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-room'))room=Number(b.dataset.room);if(b.dataset.act==='mute')muted=!muted;if(b.dataset.act==='mode')ptt=!ptt;if(b.dataset.act==='invite'){clearTimeout(tipTimer);root.querySelector('.tip')?.remove();const t=document.createElement('div');t.className='tip';t.textContent='邀请预览 · 好友点链接进入这个大厅';root.append(t);tipTimer=setTimeout(()=>t.remove(),2400);return}draw()});draw();
}
mount('app-a','light');mount('app-b','dark');
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pick').forEach(x=>{const active=x===b;x.classList.toggle('selected',active);x.setAttribute('aria-pressed',String(active));x.textContent=(active?'已选 ':'选 ')+x.dataset.choice.toUpperCase()});document.querySelector('.notice').textContent='已选 '+b.dataset.choice.toUpperCase()+'。也可以在聊天里说说想保留或调整的地方。'});
</script></body></html>
