  <div class="brand"><img id="brand-mark" width="48" height="48" alt="">GroveCall</div>
  <h1>加入友声房间</h1>
  <p id="message">打开友声，用本机昵称加入好友的房间。</p>
  <a id="join" hidden>打开友声</a>
</main>
<script>
document.getElementById('brand-mark').src = document.getElementById('app-icon').href;
const invite = window.location.hash.slice(1);
if (/^duipin:\/\/join\/[A-Za-z0-9_-]{1,16000}#[A-Fa-f0-9]{64}$/.test(invite)) {
  const button = document.getElementById('join');
  button.href = invite;
  button.hidden = false;
} else {
 document.getElementById('message').textContent = '邀请不完整，请好友从房间重新复制邀请。';
}
</script></body></html>
